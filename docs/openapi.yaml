openapi: 3.0.3
info:
  title: E-commerce REST API
  description: |
    Complete API RESTful for E-commerce platform.
    
     ## User Roles
      ### 👔 MANAGER
      - Create, update, and delete products
      - Enable/disable product visibility
      - Upload and manage product images
      - View all customer orders
      - Mark orders as shipped
      - Manage product inventory
      
      ### 👤 CLIENT
      - Browse and search products (authentication optional)
      - View detailed product information
      - Add products to shopping cart
      - Place orders and make payments
      - Leave product reviews and ratings
      - Mark products as favorites
      - Manage multiple shipping addresses
  version: 1.0.0
  # contact:
  #   name: API Support
  #   email: support@ecommerce.com
  
servers:
  - url: https://api-dev.ecommerce.com/v1
    description: Development server

security:
  - BearerAuth: []
paths:
  # ==================== AUTHENTICATION ====================
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "SecurePass123!"
                role:
                  type: string
                  enum: [MANAGER, CLIENT]
                  example: "CLIENT"
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered.

  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Successfull login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized user
          $ref: '#/components/responses/Unauthorized'

  /auth/signout:
    post:
      tags:
        - Authentication
      summary: Logout
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request for password recovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Recovery email sended
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset email sent"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  example: "abc123token456"
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully"
        '400':
          $ref: "#/components/responses/BadRequest"

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags:
        - Products
      summary: List products with pagination
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: category_id
          in: query
          description: Filter by category
          schema:
            type: integer
        - name: search
          in: query
          description: Filter by name or description
          schema:
            type: string
        - name: is_enabled
          in: query
          description: Filter by status
          schema:
            type: boolean
      responses:
        '200':
          description: OK - List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Products
      summary: Create product (MANAGER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: OK - Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':  
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product details (For everyone, authentication not required)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Product details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Products
      summary: Update product details (MANAGER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: OK - Product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Products
      summary: Update product fields (MANAGER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled:
                  type: boolean
                name:
                  type: string
                price:
                  type: number
                images:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductImage'
      responses:
        '200':
          description: OK - Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    
    delete:
      tags:
        - Products
      summary: Delete product (MANAGER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK - Product deleted successfully.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/images:
    get:
      tags:
        - Products
      summary: Get all product images
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Product images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

