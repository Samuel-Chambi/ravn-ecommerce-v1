openapi: 3.0.3
info:
  title: E-commerce REST API
  description: |
    Complete API RESTful for E-commerce platform.
    
     ## User Roles
      ### 👔 MANAGER
      - Create, update, and delete products
      - Enable/disable product visibility
      - Upload and manage product images
      - View all customer orders
      - Mark orders as shipped
      - Manage product inventory
      
      ### 👤 CLIENT
      - Browse and search products (authentication optional)
      - View detailed product information
      - Add products to shopping cart
      - Place orders and make payments
      - Leave product reviews and ratings
      - Mark products as favorites
      - Manage multiple shipping addresses

    
  version: 1.0.0

security:
  - BearerAuth: []
paths:
  # ==================== AUTHENTICATION ====================
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "SecurePass123!"
                role:
                  type: string
                  enum: [MANAGER, CLIENT]
                  example: "CLIENT"
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  $ref: '#/components/examples/missingField'
                invalidPassword:
                  $ref: '#/components/examples/invalidPassword'
                invalidEmail:
                  $ref: '#/components/examples/invalidEmail'
        '409':
          description: Conflict - Resource already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailAlreadyExists:
                  $ref: '#/components/examples/emailAlreadyExists'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Successfull login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/invalidEmail'
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  $ref: '#/components/examples/invalidCredentials'
        '404':
          description: Not found - User not found
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound: 
                  $ref: '#/components/examples/userNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /auth/signout:
    post:
      tags:
        - Authentication
      summary: Logout
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request for password recovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Recovery email sended
        '400': 
          description: Bad Request - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidEmail:
                  $ref: '#/components/examples/invalidEmail'
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  example: "abc123token456"
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '204':
          description: Password updated

        '400':
          description: Bad Request - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPassword:
                  $ref: '#/components/examples/invalidPassword'
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags:
        - Products
      summary: Get all products (with optional filters)
      security: []
      parameters:
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
            example: "electronics"
        - name: minPrice
          in: query
          description: Minimum price
          required: false
          schema:
            type: number
            example: 10.00
        - name: maxPrice
          in: query
          description: Maximum price
          required: false
          schema:
            type: number
            example: 100.00
        - name: search
          in: query
          description: Search in product name or description
          required: false
          schema:
            type: string
            example: "laptop"
        - name: sortBy
          in: query
          description: Sort field
          required: false
          schema:
            type: string
            enum: [price, name, createdAt]
            example: "price"
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            example: "asc"
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Products per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                        example: 1
                      totalPages:
                        type: integer
                        example: 5
                      totalProducts:
                        type: integer
                        example: 47
                      limit:
                        type: integer
                        example: 10
        '400':
          description: Bad Request - Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPrice:
                  $ref: '#/components/examples/invalidPrice'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

    post:
      tags:
        - Products
      summary: Create new product (MANAGER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Bad Request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPrice:
                  $ref: '#/components/examples/invalidPrice'
                missingField:
                  $ref: '#/components/examples/missingField'
                invalidQuantity:
                  $ref: '#/components/examples/invalidQuantity'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '403':
          description: Forbidden - MANAGER role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                managerRequired:
                  $ref: '#/components/examples/managerRequired'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /products/{productId}:
    get:
      tags:
        - Products
      summary: Get product by ID
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

    put:
      tags:
        - Products
      summary: Update product (MANAGER only)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Bad Request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPrice:
                  $ref: '#/components/examples/invalidPrice'  
                invalidQuantity:
                  $ref: '#/components/examples/invalidQuantity'        
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '403':
          description: Forbidden - MANAGER role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                managerRequired:
                  $ref: '#/components/examples/managerRequired'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'
    delete:
      tags:
        - Products
      summary: Delete product (MANAGER only)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '403':
          description: Forbidden - MANAGER role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                managerRequired:
                  $ref: '#/components/examples/managerRequired'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  # ============== PRODUCT IMAGES ================
  /products/{productId}/images:
    get:
      tags:
        - Product Images
      summary: Get product images
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product images list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
                    example: "Images returned successfully"
                  imageUrls:
                    type: array
                    items:
                      type: string
                      example: "https://storage.example.com/products/img1.jpg"
        '404':  
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
          
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'
    post:
      tags:
        - Product Images
      summary: Upload product images (MANAGER only)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Images uploaded successfully"
                  imageUrls:
                    type: array
                    items:
                      type: string
                      example: "https://storage.example.com/products/img1.jpg"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '403':
          description: Forbidden - MANAGER role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                managerRequired:
                  $ref: '#/components/examples/managerRequired'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'
    
  /products/{productId}/images/{imageId}:

    delete:
      tags:
        - Product Images
      summary: Delete a product image (MANAGER only)
      responses:
        '204': 
          description: Image deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
        '403':  
          description: Forbidden - MANAGER role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                managerRequired:
                  $ref: '#/components/examples/managerRequired'
        '404':
          description: Resource not found
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
                imageNotFound:
                  $ref: '#/components/examples/imageNotFound'
        '500':  
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'
  
  # ==================== CART ====================
  /cart/{userId}:
    get:
      tags:
        - Cart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      summary: Get current user's cart
      responses:
        '200':
          description: User's cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'
    delete:
      tags:
        - Cart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      summary: Clear entire cart
      responses:
        '204':
          description: Cart cleared successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /cart/{userId}/check-out:
    post:
      tags:
        - Cart
      parameters:
        - name: userId
          in: path
          required: true
          schema: 
            type: string
            format: UUID
      summary: Create an order from cart
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressId
              properties:
                addressId:
                  type: string
                  format: uuid
                  description: Shipping address ID
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cartEmpty:
                  $ref: '#/components/examples/cartEmpty'
                insufficientStock:
                  $ref: '#/components/examples/insufficientStock'
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                addressNotFound:
                  $ref: '#/components/examples/addressNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /cart/{userId}/items:
    post:
      tags:
        - Cart
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        '200':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidQuantity:
                  $ref: '#/components/examples/invalidQuantity'
                productDisabled:
                  $ref: '#/components/examples/productDisabled'
                insufficientStock:
                  $ref: '#/components/examples/insufficientStock'
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /cart/{userId}/items/{productId}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidQuantity:
                  $ref: '#/components/examples/invalidQuantity'
                insufficientStock:
                  $ref: '#/components/examples/insufficientStock'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '404':
          description: Product not found in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                productNotFound:
                  $ref: '#/components/examples/productNotFound'
        '500':
