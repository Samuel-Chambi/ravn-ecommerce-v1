        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                resourceAccessDenied:
                  $ref: '#/components/examples/resourceAccessDenied'
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                addressNotFound:
                  $ref: '#/components/examples/addressNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

    delete:
      tags:
        - Addresses
      summary: Delete address
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Address deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  $ref: '#/components/examples/invalidToken'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                resourceAccessDenied:
                  $ref: '#/components/examples/resourceAccessDenied'
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                addressNotFound:
                  $ref: '#/components/examples/addressNotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internalError:
                  $ref: '#/components/examples/internalServerError'

  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      summary: Receives webhook events from Stripe to update payment and order status.
      description: |
        **Handled Events:**
        - `payment_intent.succeeded` - Payment completed successfully
        - `payment_intent.payment_failed` - Payment failed
        - `payment_intent.canceled` - Payment canceled
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Stripe webhook signature for verification
          schema:
            type: string
          example: "t=1234567890,v1=abc123def456..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id:
                  type: string
                  example: "evt_1abc2def3ghi"
                type:
                  type: string
                  enum: 
                    - payment_intent.succeeded
                    - payment_intent.payment_failed
                    - payment_intent.canceled
                  example: "payment_intent.succeeded"
                data:
                  type: object
                  properties:
                    object:
                      type: object
                      description: The PaymentIntent object
                      properties:
                        id:
                          type: string
                          example: "pi_1abc2def3ghi"
                        amount:
                          type: number
                          description: Amount in cents
                          example: 129999
                        currency:
                          type: string
                          example: "usd"
                created:
                  type: integer
                  description: Unix timestamp when event was created
                  example: 1234567890
      responses:
        '200':
          description: OK - Webhook processed successfully
        '400':
          description: Bad request - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  $ref: '#/components/examples/missingField'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenExpired:
                  $ref: '#/components/examples/tokenExpired'
        '403':  
          description: Forbidden - No permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientPermissions:
                  $ref: '#/components/examples/insufficientPermissions'

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              type: string
              enum: [MANAGER, CLIENT]

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
          example: "High-quality wireless headphones with noise cancellation"
        price:
          type: number
          format: float
          example: 99.99
        stock:
          type: integer
          example: 50
        category:
          type: string
          example: "electronics"
        images:
          type: array
          items:
            type: string
            example: "https://example.com/images/headphones.jpg"
        enabled:
          type: boolean
          example: true
        averageRating:
          type: number
          example: 4.5
        totalReviews:
          type: integer
          example: 127
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - stock
        - category
      properties:
        name:
          type: string
          minLength: 3
          example: "Wireless Headphones"
        description:
          type: string
          minLength: 10
          example: "High-quality wireless headphones"
        price:
          type: number
          format: float
          minimum: 0.01
          example: 99.99
        stock:
          type: integer
          minimum: 0
          example: 50
        category:
          type: string
          example: "electronics"
        images:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true

    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              product:
                $ref: '#/components/schemas/Product'
              quantity:
                type: integer
                example: 2
              subtotal:
                type: number
                example: 199.98
        total:
          type: number
          example: 199.98
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              product:
                $ref: '#/components/schemas/Product'
              quantity:
                type: integer
              price:
                type: number
              subtotal:
                type: number
        total:
          type: number
          example: 199.98
        status:
          type: string
          enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
          example: "PENDING"
        shippingAddress:
          $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        amount:
          type: number
          example: 199.98
        currency:
          type: string
          example: "usd"
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REFUNDED]
          example: "COMPLETED"
        paymentIntentId:
          type: string
          example: "pi_abc123"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
          example: "John Doe"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: "Excellent product! Highly recommended."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        street:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zipCode:
          type: string
          example: "10001"
        country:
          type: string
          example: "USA"
        isDefault:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddressInput:
      type: object
      required:
        - street
        - city
        - state
        - zipCode
        - country
      properties:
        street:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zipCode:
          type: string
          example: "10001"
        country:
          type: string
          example: "USA"
        isDefault:
          type: boolean
          default: false

    Error:
      type: object
      required: [error, message, error_code]
      properties:
        error:
          type: string
          description: HTTP error name
        message:
          type: string
          description: Error description
        error_code:
          type: string
          description: Specific error code
          enum:
            # BAD REQUEST ERRORS (400)
            - MISSING_REQUIRED_FIELD
            - INVALID_EMAIL_FORMAT
            - INVALID_PASSWORD_FORMAT
            - INVALID_QUANTITY
            - INVALID_PRICE
            - CART_EMPTY
            - ORDER_ALREADY_PAID
            - ORDER_CANNOT_BE_CANCELLED
            - PRODUCT_DISABLED
            - INSUFFICIENT_STOCK
            - INVALID_STATUS_TRANSITION
            - PAYMENT_INTENT_CREATION_FAILED
            - PAYMENT_ALREADY_PROCESSED
            - INVALID_CURRENCY_TYPE

            # AUTH ERRORS (401)
            - INVALID_CREDENTIALS
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            
            # AUTHORIZATION ERRORS (403)
            - INSUFFICIENT_PERMISSIONS
            - MANAGER_ROLE_REQUIRED
            - RESOURCE_ACCESS_DENIED
            
            # NOT FOUND ERRORS (404)
            - USER_NOT_FOUND
            - PRODUCT_NOT_FOUND
            - ORDER_NOT_FOUND
            - CART_NOT_FOUND
            - ADDRESS_NOT_FOUND
            - PAYMENT_NOT_FOUND
            - IMAGE_NOT_FOUND

            # CONFLICT ERRORS (409)
            - EMAIL_ALREADY_EXISTS
            - PRODUCT_ALREADY_LIKED
            - REVIEW_ALREADY_EXISTS

            # INTERNAL SERVER ERRORS (500)
            - INTERNAL_SERVER_ERROR
  
  examples:
    # Bad request errors
    missingField:
      summary: Missing required fields
      value:
        error: "Bad request"
        message: "Some required field is missing"
        error_code: 'MISSING_REQUIRED_FIELD'
    invalidEmail:
      summary: Invalid email format
      value:
        error: "Bad request"
        message: "Email value has a wrong format"
        error_code: 'INVALID_EMAIL_FORMAT'
    invalidPassword:
      summary: Invalid password format
      value:
        error: "Bad Request"
        message: "Password must be at least 8 characters long and contain letters and numbers"
        error_code: 'INVALID_PASSWORD_FORMAT'
    invalidQuantity:
      summary: Invalid quantity value
      value:
        error: "Bad Request"
        message: "Quantity must be a positive integer greater than zero"
        error_code: 'INVALID_QUANTITY'
    invalidPrice:
      summary: Invalid price value
      value:
        error: "Bad Request"
        message: "Price must be a positive number greater than zero"
        error_code: 'INVALID_PRICE'
    cartEmpty:
      summary: Cart is empty
      value:
        error: "Bad Request"
        message: "Cannot create order from an empty cart"
        error_code: 'CART_EMPTY'
    orderAlreadyPaid:
      summary: Order already paid
      value:
        error: "Bad Request"
        message: "This order has already been paid"
        error_code: 'ORDER_ALREADY_PAID'
    orderCancelError:
      summary: Order cannot be cancelled
      value:
        error: "Bad Request"
        message: "Order cannot be cancelled in its current status"
        error_code: 'ORDER_CANNOT_BE_CANCELLED'
    productDisabled:
      summary: Product is disabled
      value:
        error: "Bad Request"
        message: "This product is currently disabled and cannot be purchased"
        error_code: 'PRODUCT_DISABLED'
    insufficientStock:
      summary: Insufficient stock
      value:
        error: "Bad Request"
        message: "Product does not have enough stock available"
        error_code: 'INSUFFICIENT_STOCK'
    invalidStatusTransition:
      summary: Invalid status transition
      value:
        error: "Bad Request"
        message: "Cannot transition order from current status to requested status"
        error_code: 'INVALID_STATUS_TRANSITION'
    invalidCurrency:  
      summary: Invalid currency type
      value:
        error: "Bad Request"
        message: "Invalid currency type"
        error_code: 'INVALID_CURRENCY_TYPE'
    paymentIntentCreationFailed:
      summary: Payment intent creation failed
      value:
        error: "Bad Request"
        message: "Failed to create payment intent with Stripe"
        error_code: 'PAYMENT_INTENT_CREATION_FAILED'
    paymentAlreadyProcessed:
      summary: Payment already processed
      value:
        error: "Bad Request"
        message: "A payment for this order has already been processed"
        error_code: 'PAYMENT_ALREADY_PROCESSED'
    invalidRating: 
      summary: Rating is invalid
      value:
        error: "Bad Request"
        message: "Rating value is invalid"
        error_code: "INVALID_RATING"
    emptyComment:
      summary: Comment field is empty
      value:
        error: "Bad Request"
        message: "Comment value cannot be empty"
        error_code: "EMPTY_COMMENT"

    # Unauthorized errors 
    invalidToken:
      summary: Invalid token
      value:
        error: "Unauthorized"
        message: "The provided token is invalid"
        error_code: "TOKEN_INVALID"
    tokenExpired:
      summary: Token expired
      value:
        error: "Unauthorized"
        message: "Your session has expired"
        error_code: "TOKEN_EXPIRED"
    invalidCredentials:
      summary: Invalid credentials
      value:
        error: "Unauthorized"
        message: "Email or password is incorrect"
        error_code: "INVALID_CREDENTIALS"

    # Forbidden errors
    managerRequired:
      summary: Manager role required
      value:
        error: "Forbidden"
        message: "This action requires MANAGER role"
        error_code: "MANAGER_ROLE_REQUIRED"
    resourceAccessDenied:
      summary: Access denied to resource
      value:
        error: "Forbidden"
        message: "You don't have permission to access this order"
        error_code: "RESOURCE_ACCESS_DENIED"
    insufficientPermissions:
      summary: Insufficient permissions
      value:
        error: "Forbidden"
        message: "Your session has not permission to get this."
        error_code: "INSUFFICIENT_PERMISSIONS"

    # Not found errors
    productNotFound:
      summary: Product not found
      value:
        error: "Not Found"
        message: "Product with ID value does not exist"
        error_code: "PRODUCT_NOT_FOUND"
    userNotFound:
      summary: User not found
      value:
        error: "Not Found"
        message: "User does not exist"
        error_code: "USER_NOT_FOUND"
    orderNotFound:
      summary: Order not found
      value:
        error: "Not Found"
        message: "Order with ID value does not exist"
        error_code: "ORDER_NOT_FOUND"
    addressNotFound:
      summary: Address not found
      value:
        error: "Not Found"
        message: "Address not found"
        error_code: "ADDRESS_NOT_FOUND"
    paymentNotFound:
      summary: Payment not found
      value:
        error: "Not Found"
        message: "Payment not found"
        error_code: "PAYMENT_NOT_FOUND"
    categoryNotFound:
      summary: Category not found
      value:
        error: "Not Found"
        message: "Category not found"
        error_code: "CATEGORY_NOT_FOUND"
    reviewNotFound:
      summary: Review not found
      value:
        error: "Not Found"
        message: "Review with ID value does not exist"
        error_core: "REVIEW_NOT_FOUND"
    imageNotFound:
      summary: Image not found
      value:
        error: "Not Found"
        message: "Image with ID value does not exist"
        error_code: "IMAGE_NOT_FOUND"
    # Conflict errors
    emailAlreadyExists:
      summary: Email already exists
      value:
        error: "Conflict"
        message: "Email is already used"
        error_code: "EMAIL_ALREADY_EXISTS"
    productAlreadyLiked:
      summary: Product already marked as favorite
      value:
        error: "Conflict"
        message: "Product already marked as favorite"
        error_code: "PRODUCT_ALREADY_LIKED"
    reviewAlreadyExists:
      summary: A review was already created fot this product
      value:
        error: "Conflict"
        message: "Review already exists"
        error_code: "REVIEW_ALREADY_EXISTS"

    # Internal Server Error
    internalServerError:
      summary: Internal server error
      value:
        error: "Internal Server Error"
        message: "An unexpected error occurred on the server"
        error_code: "INTERNAL_SERVER_ERROR"