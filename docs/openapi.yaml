  # ==================== CATEGORIES ====================
  /categories:
    get:
      tags:
        - Categories
      summary: List categories
      security: []
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: OK - Categories list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags:
        - Categories
      summary: Create category (MANAGER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Electrónica"
      responses:
        '201':
          description: OK - Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/{id}:
    patch:
      tags:
        - Categories
      summary: Update category fields (MANAGER only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: OK - Catagory updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== CART ====================
  /cart:
    get:
      tags:
        - Cart
      summary: Retrieves the current cart items for the authenticated user.
      responses:
        '200':
          description: OK - User cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Cart
      summary: Add product to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: OK - Product added to cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'

  /cart/check-out:
    post:
      tags:
        - Cart
      summary: Create an order from cart
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Cart'
      responses:
        '200': 
          description: OK - Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':  
          $ref: '#/components/responses/Unauthorized'

  /cart/items/{itemId}:
    put:
      tags:
        - Cart
      summary: Update product quantity in cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Quantity updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

    delete:
      tags:
        - Cart
      summary: Delete item from cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Item deleted.

  # ==================== ORDERS ====================
  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      description: |
        - MANAGER: Can see all the orders.
        - CLIENT: Only can see its own orders.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PAID, CANCELLED, SHIPPED]
        - name: user_id
          in: query
          description: MANAGER only - Filter by User
          schema:
            type: integer
      responses:
        '200':
          description: OK - Orders list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

    # post:
    #   tags:
    #     - Orders
    #   summary: Create order from Cart
    #   requestBody:
    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           type: object
    #           required:
    #             - shipping_address_id
    #           properties:
    #             shipping_address_id:
    #               type: integer
    #               description: Address ID.
    #   responses:
    #     '201':
    #       description: Order created successfully.
    #       content:
    #         application/json:
    #           schema:
    #             $ref: '#/components/schemas/Order'
    #     '400':
    #       $ref: "#/components/responses/BadRequest"

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Orders
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CANCELLED, SHIPPED, PAID, PENDING]
      responses:
        '200':
          description: OK - Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== PAYMENTS ====================
  /payments:
    post:
      tags:
        - Payments
      summary: Create payment intent for Stripe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  example: "USD"
                order_id: 
                  type: integer
                  example: 1
      responses:
        '200':
          description: OK - Payment intent created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret:
                    type: string
                    example: "pi_xxx_secret_yyy"
                  payment_intent_id:
                    type: string
                    example: "pi_1234567890"
                  amount:
                    type: number
                    format: decimal
                  status:
                    type: string
                    example: succeeded
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"

  /payments/{id}:
    get:
      tags:
        - Payments
      summary: Get payment details.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Payment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  # ==================== WEBHOOKS ====================
  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      summary: Stripe webhook endpoint
      description: |
        Receives webhook events from Stripe to update payment and order status.
        
        **Handled Events:**
        - `payment_intent.succeeded` - Payment completed successfully
        - `payment_intent.payment_failed` - Payment failed
        - `payment_intent.canceled` - Payment canceled
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Stripe webhook signature for verification
          schema:
            type: string
          example: "t=1234567890,v1=abc123def456..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id:
                  type: string
                  example: "evt_1abc2def3ghi"
                type:
                  type: string
                  enum: 
                    - payment_intent.succeeded
                    - payment_intent.payment_failed
                    - payment_intent.canceled
                  example: "payment_intent.succeeded"
                data:
                  type: object
                  properties:
                    object:
                      type: object
                      description: The PaymentIntent object
                      properties:
                        id:
                          type: string
                          example: "pi_1abc2def3ghi"
                        amount:
                          type: number
                          description: Amount in cents
                          example: 129999
                        currency:
                          type: string
                          example: "usd"
                created:
                  type: integer
                  description: Unix timestamp when event was created
                  example: 1234567890
      responses:
        '200':
          description: OK - Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true


  # ==================== REVIEWS ====================
  /products/{id}/reviews:
    get:
      tags:
        - Reviews
      summary: Get product reviews
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK - Reviews list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  average_rating:
                    type: number
                    format: float
                    example: 4.5

    post:
      tags:
        - Reviews
      summary: Create product review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: OK - Review created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: "#/components/responses/BadRequest"

  /reviews/{id}:
    put:
      tags:
        - Reviews
      summary: Update review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Review updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

    delete:
      tags:
        - Reviews
      summary: Delete review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK - Review deleted.

  # ==================== LIKES ====================
  /products/{id}/like:
    post:
      tags:
        - Likes
      summary: Mark product as favorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: OK - Like added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"

    delete:
      tags:
        - Likes
      summary: Remove like from a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK - Like removed.
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"

  /users/me/likes:
    get:
      tags:
        - Likes
      summary: Get favorite products from the user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK - Favorite products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== ADDRESSES ====================
  /addresses:
    get:
      tags:
        - Addresses
      summary: List user addresses
      responses:
        '200':
          description: OK - Addresses list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Addresses
      summary: Create address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: OK - Address created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'


  /addresses/{id}:
    put:
      tags:
        - Addresses
      summary: Update address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: 
        - Addresses
      summary: Update address (including set as default)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                street:
                  type: string
                city:
                  type: string
                state:
                  type: string
                country:
                  type: string
                zip_code:
                  type: string
                is_default:
                  type: boolean
                  description: Set this address as default (automatically unsets other default addresses)
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Addresses
      summary: Delete address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: OK - Address deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'


# ==================== COMPONENTS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained on login

  schemas:
    # Auth Schemas
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        role:
          type: string
          enum: [MANAGER, CLIENT]
          example: "CLIENT"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    # Product Schemas
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Laptop Dell XPS 15"
        description:
          type: string
          example: "Powerfull laptop for professionals"
        price:
          type: number
          format: decimal
          example: 1299.99
        is_enabled:
          type: boolean
          example: true
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        created_at:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            inventory:
              type: object
              properties:
                quantity:
                  type: integer
                  example: 10
                updated_at:
                  type: string
                  format: date-time
            average_rating:
              type: number
              format: float
              example: 4.5
            total_reviews:
              type: integer
              example: 23
            total_likes:
              type: integer
              example: 150
    ProductInput:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          example: "Laptop Dell XPS 15"
        description:
          type: string
          example: "Powerfull laptop for professionals"
        price:
          type: number
          format: decimal
          example: 1299.99
        category_id:
          type: integer
          example: 1
        initial_stock:
          type: integer
          minimum: 0
          example: 10
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
    ProductImage:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        image_url:
          type: string
          format: uri
          example: "https://cdn.example.com/products/laptop-dell-xps-15.jpg"
        is_primary:
          type: boolean
          example: true

    # Category Schema
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Electrónica"
        is_active:
          type: boolean
          example: true

    # Cart Schemas
    Cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum: [ACTIVE, ORDERED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: decimal
          example: 2599.98
        created_at:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        id:
          type: integer
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          example: 2
        subtotal:
          type: number
          format: decimal
          example: 2599.98

    # Order Schemas
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED, SHIPPED]
        total_amount:
          type: number
          format: decimal
          example: 2599.98
        shipping_address:
          $ref: '#/components/schemas/Address'
        created_at:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/Product'
                  quantity:
                    type: integer
                  price:
                    type: number
            shipping_address:
              $ref: '#/components/schemas/Address'
            payment:
              type: object
              properties:
                id:
                  type: integer
                status:
                  type: string
                  enum: [CREATED, SUCCEEDED, FAILED]
                amount:
                  type: number

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer


    Address:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    AddressInput:
      type: object
      required: [full_name, phone, street, city, country, zip_code, is_default]
      properties:
        full_name:
          type: string
        phone:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        zip_code:
          type: string
        is_default:
          type: boolean

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Payment:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        stripe_payment_intent:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [CREATED, SUCCEEDED, FAILED]
        created_at:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        product_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    Like:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        product_id:
          type: integer
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
  responses:  
    BadRequest:
      description: Bad Request - Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Bad Request"
            message: "The provided data is invalid"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "Invalid or expired token"

    Forbidden:
      description: Forbidden - No permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
            message: "You do not have permission to perform this action"

    NotFound:
      description: Not Found - Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            message: "The requested resource does not exist" 

    Conflict:
      description: Conflict - Resource already exists or there is a status conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Conflict"
            message: "Resource already exists or there is a status conflict"